# Déploiement Railway (région UE à choisir dans le projet Railway : europe-west4).
# Un service "web" construit depuis ce Dockerfile + un plugin PostgreSQL.
# Variables à définir : DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, DJANGO_CSRF_TRUSTED_ORIGINS,
# DATABASE_URL (fournie par le plugin), CORS_ALLOWED_ORIGINS.
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/api/health/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
